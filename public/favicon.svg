<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 機構カラムの意匠: ガンメタルの筐体を貫くシアンの導管 -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161C1F"/>
      <stop offset="1" stop-color="#080A0B"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46555C"/>
      <stop offset="0.5" stop-color="#2A3438"/>
      <stop offset="1" stop-color="#1A2226"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FD8E0" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#9DF2F7"/>
      <stop offset="1" stop-color="#4FD8E0" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#body)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#232D31"/>

  <!-- 導管の光の広がり -->
  <rect x="11.5" y="1" width="9" height="30" fill="#4FD8E0" opacity="0.12"/>
  <!-- 導管 -->
  <rect x="14.5" y="1" width="3" height="30" fill="url(#beam)"/>

  <!-- 上下の締結カラー -->
  <rect x="5.5" y="7" width="21" height="5" rx="1.4" fill="url(#collar)"/>
  <rect x="5.5" y="20" width="21" height="5" rx="1.4" fill="url(#collar)"/>
  <rect x="5.5" y="7" width="21" height="1" rx="0.5" fill="#5B6C74" opacity="0.8"/>
  <rect x="5.5" y="20" width="21" height="1" rx="0.5" fill="#5B6C74" opacity="0.8"/>

  <!-- カラーを貫く導管（前面に出して連続させる） -->
  <rect x="14.5" y="7" width="3" height="5" fill="#9DF2F7" opacity="0.95"/>
  <rect x="14.5" y="20" width="3" height="5" fill="#9DF2F7" opacity="0.95"/>

  <!-- 基板の金メッキ端子 -->
  <rect x="7.6" y="8.9" width="2.2" height="1.4" rx="0.4" fill="#C9A227"/>
  <rect x="22.2" y="8.9" width="2.2" height="1.4" rx="0.4" fill="#C9A227"/>
  <rect x="7.6" y="21.9" width="2.2" height="1.4" rx="0.4" fill="#C9A227"/>
  <rect x="22.2" y="21.9" width="2.2" height="1.4" rx="0.4" fill="#C9A227"/>
</svg>
